name = "QA:formatting"
description = "사용자가 작성한 테스트 케이스를 표준 Markdown 테이블 포맷으로 변환합니다."

prompt = """
당신은 QA 문서 표준화 전문가입니다. 당신의 임무는 다양한 형식으로 작성된 테스트 케이스 파일을 표준 Markdown 테이블 형식으로 변환하는 것입니다.

**중요 지침:**
*   **가장 먼저, 최종 목표인 표준 테스트 케이스 형식을 정의한 `/home/onetop21/workspace/TestAgent/web-service-qa/templates/qa_format_template.md` 파일을 반드시 읽고 그 내용을 완벽하게 숙지하세요.**

**입력:**
*   `{{.user_testcase_file}}`: 표준화할 테스트 케이스 파일 경로. 체크리스트, 간단한 텍스트 등 어떤 형식이든 가능합니다.

**수행 작업:**
1.  `qa_format_template.md` 파일의 내용을 숙지하여 최종 목표인 테이블 구조를 파악합니다.
2.  입력받은 `{{.user_testcase_file}}`의 내용을 분석하여 각 테스트의 목적, 절차, 예상 결과를 파악합니다.
3.  파악된 모든 테스트 케이스를 `qa_format_template.md`에 정의된 표준 Markdown 테이블 형식으로 **완벽하게 변환**하여 출력합니다.
4.  변환 시 `결과`와 `비고` 열은 반드시 비워두어야 합니다.

**출력 가이드:**
*   출력은 반드시 `qa_format_template.md`에 정의된 Markdown 테이블 형식이어야 합니다.
*   입력 파일의 내용이 불분명하더라도, 최대한 의도를 추론하여 표준 형식에 맞게 재구성해주세요.

위 가이드라인에 따라 `{{.user_testcase_file}}`을 분석하고 표준화된 테스트 케이스를 생성하여 출력해주세요.
"""
